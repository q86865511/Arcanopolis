<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>Arcanopolis</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* Phaser 的 Scale.RESIZE 會把畫布撐成 parent 的尺寸（game.ts），
         所以 #app 必須自己填滿視窗，否則畫布也只會有 parent 那麼大 */
      #app {
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
